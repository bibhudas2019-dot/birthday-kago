<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Kago 🎂</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to top right, #ffdde1, #ee9ca7);
      overflow: hidden;
      font-family: "Comic Sans MS", cursive;
    }

    /* Gift box */
    .gift {
      position: relative;
      width: 120px;
      height: 120px;
      background: hotpink;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: bounce 1.5s infinite;
    }

    .gift:before {
      content: "";
      position: absolute;
      width: 20px;
      height: 120px;
      background: gold;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      border-radius: 5px;
    }

    .gift:after {
      content: "";
      position: absolute;
      width: 120px;
      height: 20px;
      background: gold;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      border-radius: 5px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Hidden surprise */
    .surprise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-size: 2rem;
      text-align: center;
      padding: 20px;
    }

    /* Balloons */
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 60px;
      height: 80px;
      border-radius: 50% 50% 50% 50%;
      background: red;
      animation: float 6s infinite ease-in;
    }
    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    /* Cats */
    .cats {
      margin-top: 20px;
      display: flex;
      gap: 30px;
      font-size: 4rem;
    }
  </style>
</head>
<body>

  <div class="gift" id="gift"></div>

  <div class="surprise" id="surprise">
    <h1>🎉 Happy Birthday Kago 🎉</h1>
    <div class="cats">
      🐈‍⬛ 🐈
    </div>
    <p>Wishing you lots of joy, love & laughter 💖</p>
  </div>

  <audio id="music" src="https://www2.cs.uic.edu/~i101/SoundFiles/StarWars60.wav"></audio>

  <script>
    const gift = document.getElementById("gift");
    const surprise = document.getElementById("surprise");
    const music = document.getElementById("music");

    gift.addEventListener("click", () => {
      gift.style.display = "none";
      surprise.style.display = "flex";
      music.play();

      // create balloons
      for (let i=0; i<15; i++) {
        let balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.style.left = Math.random()*100 + "vw";
        balloon.style.background = hsl(${Math.random()*360},70%,60%);
        balloon.style.animationDuration = (4+Math.random()*3) + "s";
        surprise.appendChild(balloon);
      }
    });
  </script>

</body>
</html>
