<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Kago 🎁</title>
<style>
body {
    margin: 0;
    background: linear-gradient(#ffe4ec, #ffeeda);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive;
}
.gift {
    position: relative;
    width: 150px;
    height: 150px;
    background: #ff4fa3;
    border-radius: 10px;
    cursor: pointer;
}
.ribbon {
    position: absolute;
    background: yellow;
}
.ribbon.vertical {
    width: 20px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
}
.lid {
    position: absolute;
    top: -40px;
    left: 0;
    width: 150px;
    height: 40px;
    background: #ff4fa3;
    border-radius: 10px;
    transform-origin: bottom;
    transition: transform 1s ease;
}
.open .lid {
    transform: rotateX(150deg) translateY(-10px);
}
.hidden {
    display: none;
}
.message {
    text-align: center;
    animation: fadeIn 2s ease forwards;
}
@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.8);}
    to {opacity: 1; transform: scale(1);}
}
.cat-container {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}
.cat {
    width: 120px;
}
.balloons {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}
.balloon {
    position: absolute;
    bottom: -150px;
    width: 50px;
    height: 70px;
    background: red;
    border-radius: 50%;
    animation: rise 5s linear infinite;
}
@keyframes rise {
    to { transform: translateY(-110vh);}
}
</style>
</head>
<body>

<div class="gift" id="giftBox">
    <div class="lid"></div>
    <div class="ribbon vertical"></div>
</div>

<div class="balloons" id="balloonContainer"></div>

<div class="hidden message" id="messageBox">
    <h1>🎉 Happy Birthday Kago 🎉</h1>
    <div class="cat-container">
        <img src="https://i.imgur.com/vy6z2Qh.png" class="cat" alt="White Cat">
        <img src="https://i.imgur.com/XE8HjPq.png" class="cat" alt="Black Cat">
    </div>
    <p>Hey, Happy Birthday to you cute Kago... enjoy the day and life ❤</p>
    <h3>~ Bibhu</h3>
</div>

<audio id="song" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
const giftBox = document.getElementById('giftBox');
const messageBox = document.getElementById('messageBox');
const song = document.getElementById('song');
const balloonContainer = document.getElementById('balloonContainer');

giftBox.addEventListener('click', () => {
    giftBox.classList.add('open');
    setTimeout(() => {
        messageBox.classList.remove('hidden');
        song.play();
        releaseBalloons();
        releaseConfetti();
    }, 1000);
});

function releaseBalloons() {
    for (let i = 0; i < 15; i++) {
        let balloon = document.createElement('div');
        balloon.classList.add('balloon');
        balloon.style.background = randomColor();
        balloon.style.left = Math.random() * 100 + 'vw';
        balloon.style.animationDuration = (3 + Math.random() * 2) + 's';
        balloonContainer.appendChild(balloon);
        setTimeout(() => balloon.remove(), 5000);
    }
}

function randomColor() {
    const colors = ['#ff4fa3', '#ffdd00', '#00cfff', '#9b59b6', '#2ecc71'];
    return colors[Math.floor(Math.random() * colors.length)];
}

function releaseConfetti() {
    for (let i = 0; i < 100; i++) {
        let confetti = document.createElement('div');
        confetti.style.position = 'absolute';
        confetti.style.width = '8px';
        confetti.style.height = '8px';
        confetti.style.background = randomColor();
        confetti.style.top = '-10px';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.opacity = 0.8;
        confetti.style.transform = rotate(${Math.random()*360}deg);
        confetti.style.animation = fall ${2+Math.random()*3}s linear forwards;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
    }
}

document.head.insertAdjacentHTML('beforeend', `
<style>
@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
`);
</script>

</body>
</html>
