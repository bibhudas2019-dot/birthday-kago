<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Kago 🎉</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #ffe6f0, #fff0e6);
        font-family: 'Comic Sans MS', cursive;
        overflow: hidden;
        text-align: center;
    }
    /* Gift Box */
    .gift {
        position: relative;
        width: 200px;
        height: 200px;
        margin: 150px auto 0;
        animation: wiggle 1.5s infinite;
    }
    .box {
        background: #ff66b2;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        position: relative;
        z-index: 1;
    }
    .lid {
        background: #ff3385;
        width: 220px;
        height: 40px;
        position: absolute;
        top: -40px;
        left: -10px;
        border-radius: 8px;
        z-index: 2;
        transition: transform 1s ease;
        transform-origin: bottom;
    }
    .ribbon {
        background: yellow;
        width: 20px;
        height: 200px;
        position: absolute;
        left: 90px;
        top: 0;
        z-index: 3;
    }
    /* Reveal Content */
    .content {
        opacity: 0;
        transform: scale(0.5);
        transition: all 1s ease;
    }
    .show {
        opacity: 1;
        transform: scale(1);
    }
    /* Cats */
    .cats {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
    }
    .cat {
        width: 100px;
        animation: sway 2s infinite ease-in-out;
    }
    /* Text */
    h1 {
        color: #ff3385;
        font-size: 2.5em;
        text-shadow: 0 0 10px white, 0 0 20px pink;
        animation: glow 2s infinite alternate;
    }
    p {
        font-size: 1.2em;
        color: #333;
        max-width: 500px;
        margin: auto;
    }
    /* Animations */
    @keyframes wiggle {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(1deg); }
        75% { transform: rotate(-1deg); }
    }
    @keyframes sway {
        0%, 100% { transform: rotate(0); }
        50% { transform: rotate(2deg); }
    }
    @keyframes glow {
        from { text-shadow: 0 0 10px pink, 0 0 20px pink; }
        to { text-shadow: 0 0 20px hotpink, 0 0 30px hotpink; }
    }
</style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2023/03/15/audio_c87d1dfc64.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
</audio>

<div class="gift" id="giftBox">
    <div class="lid" id="lid"></div>
    <div class="box"></div>
    <div class="ribbon"></div>
</div>

<div class="content" id="surpriseContent">
    <h1>Happy Birthday Kago 🎉</h1>
    <div class="cats">
        <img src="https://cdn.pixabay.com/photo/2016/03/31/19/56/cartoon-1299390_1280.png" class="cat" alt="Black Cat">
        <img src="https://cdn.pixabay.com/photo/2017/01/31/20/29/cat-2022347_1280.png" class="cat" alt="White Cat">
    </div>
    <p>HEY, HAPPY BIRTHDAY TO YOU CUTE KAGO... enjoy the day and life — <b>Bibhu</b></p>
</div>

<script>
    const lid = document.getElementById('lid');
    const content = document.getElementById('surpriseContent');
    const music = document.getElementById('bgMusic');

    // Start music after first click
    document.body.addEventListener('click', () => {
        music.play();
    }, { once: true });

    // Open the gift after 5 seconds
    setTimeout(() => {
        lid.style.transform = 'rotateX(120deg)';
        setTimeout(() => {
            content.classList.add('show');
            launchConfetti();
        }, 1000);
    }, 5000);

    // Confetti effect
    function launchConfetti(){
        const duration = 3000;
        const animationEnd = Date.now() + duration;
        const colors = ['#ff0a54', '#ff477e', '#ff85a1', '#fbb1bd', '#f9bec7'];

        (function frame(){
            const timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return;
            const particle = document.createElement('div');
            document.body.appendChild(particle);
            const size = Math.random() * 8 + 4 + 'px';
            particle.style.position = 'fixed';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = '-10px';
            particle.style.width = size;
            particle.style.height = size;
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.borderRadius = '50%';
            particle.style.opacity = Math.random();
            particle.style.zIndex = 1000;
            particle.style.transition = 'transform 3s ease, top 3s ease, opacity 3s ease';
            requestAnimationFrame(() => {
                particle.style.top = '100vh';
                particle.style.transform = translateX(${(Math.random() - 0.5) * 200}px);
                particle.style.opacity = 0;
            });
            setTimeout(() => particle.remove(), 3000);
            requestAnimationFrame(frame);
        })();
    }
</script>

</body>
</html>
