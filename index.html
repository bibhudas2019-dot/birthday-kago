<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Surprise</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .gift {
      width: 150px;
      height: 150px;
      background: #ff4d6d;
      position: relative;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.5s;
    }
    .gift:before, .gift:after {
      content: "";
      position: absolute;
      background: gold;
    }
    .gift:before {
      width: 20px;
      height: 100%;
      left: 65px;
      top: 0;
    }
    .gift:after {
      height: 20px;
      width: 100%;
      top: 65px;
      left: 0;
    }
    .message {
      display: none;
      font-size: 22px;
      text-align: center;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 10px;
    }
    .open {
      transform: scale(0);
    }
  </style>
</head>
<body>
  <div class="gift" onclick="openGift()"></div>
  <div class="message" id="message">
    🎉 Happy Birthday! 🎂💖 <br>
    Wishing you all the happiness in the world! 🌸
  </div>

  <script>
    function openGift() {
      document.querySelector(".gift").classList.add("open");
      document.getElementById("message").style.display = "block";
    }
  </script>
</body>
</html>
